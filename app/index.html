<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0b0b0d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Chalkbook — Workout Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0b0b0d; --s1:#141417; --s2:#1c1c20; --s3:#26262c; --line:#2a2a31;
  --tx:#f4f4f5; --tx2:#a3a3ad; --tx3:#6e6e78;
  --acc:#2dd4bf; --acc-ink:#0b0b0d; --acc-dim:rgba(45,212,191,.10); --acc-mid:rgba(45,212,191,.22);
  --warm:#fbbf24; --drop:#c4a1ff; --danger:#ff7a7a;
  --r:14px; --head:'Barlow Condensed',system-ui,sans-serif; --body:'Barlow',system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{background:var(--page-bg,var(--bg));background-attachment:fixed;min-height:100vh}
html,body{margin:0;color:var(--tx);font-family:var(--body);font-size:16px;line-height:1.4}
body.locked{overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,textarea,select{font:inherit;color:var(--tx)}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.wrap{max-width:520px;margin:0 auto;padding:16px 16px 120px}
h1,h2,h3{font-family:var(--head);margin:0;letter-spacing:.01em}
.muted{color:var(--tx2)} .faint{color:var(--tx3)}

/* top */
.top{display:flex;align-items:center;justify-content:space-between;margin:4px 0 18px}
.brand{font-family:var(--head);font-weight:800;font-size:22px;letter-spacing:.14em;display:flex;align-items:center;gap:8px}
:root{--mark:url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2064%2064%22%20fill%3D%22%23000%22%3E%3Cg%20stroke%3D%22%23000%22%20stroke-width%3D%227%22%20stroke-linecap%3D%22round%22%20fill%3D%22none%22%3E%3Cpath%20d%3D%22M14%2012v40M26%2012v40M38%2012v40M50%2012v40%22%2F%3E%3Cpath%20d%3D%22M7%2044L57%2020%22%2F%3E%3C%2Fg%3E%3C%2Fsvg%3E")}
.brand-dot{width:20px;height:20px;flex:none;background:var(--acc-bg);-webkit-mask:var(--mark) center/contain no-repeat;mask:var(--mark) center/contain no-repeat}
.pill{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border-radius:999px;background:var(--s2);color:var(--tx2);font-size:13px;font-weight:600}
.pill svg.i{width:15px;height:15px}
.pill.ok{color:var(--acc)}
.h1{font-size:34px;font-weight:800;line-height:1.05;margin-bottom:14px;text-transform:uppercase}

/* stats */
.stats3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:16px}
.stat{background:var(--s1);border:1px solid var(--line);border-radius:var(--r);padding:12px}
.stat b{display:block;font-family:var(--head);font-size:30px;font-weight:700;line-height:1}
.stat span{font-size:12px;color:var(--tx2);font-weight:600;text-transform:uppercase;letter-spacing:.06em}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:44px;padding:0 16px;border-radius:12px;font-weight:700;font-size:15px;letter-spacing:.01em;transition:transform .08s,background .15s}
.btn:active{transform:scale(.98)}
.btn.block{display:flex;width:100%}
.btn.lg{height:54px;font-size:17px;font-family:var(--head);text-transform:uppercase;letter-spacing:.08em;font-size:19px}
.btn.sm{height:36px;padding:0 14px;font-size:14px;border-radius:10px}
.btn-acc{background:var(--acc-bg);color:var(--acc-ink)}
.btn-ghost{background:var(--s2);color:var(--tx)}
.btn-line{border:1px solid var(--line);color:var(--tx)}
.btn-danger{background:var(--danger);color:#1a0b0b}
.btn-danger-ghost{color:var(--danger);background:transparent}
.icon-btn{width:40px;height:40px;border-radius:10px;display:inline-flex;align-items:center;justify-content:center;color:var(--tx2)}
.icon-btn:active{background:var(--s2)}
.link{color:var(--acc);font-weight:700;font-size:14px;padding:6px 4px}

/* sections */
.sec-head{display:flex;align-items:center;justify-content:space-between;margin:26px 0 10px}
.sec-head h2{font-size:22px;font-weight:700;text-transform:uppercase;letter-spacing:.04em}
.sec-head .acts{display:flex;gap:10px}
.card{background:var(--s1);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.list{display:flex;flex-direction:column;gap:10px}
.empty{border:1px dashed var(--line);border-radius:var(--r);padding:22px 16px;text-align:center;color:var(--tx2)}
.empty b{display:block;color:var(--tx);font-family:var(--head);font-size:20px;margin-bottom:4px;text-transform:uppercase;letter-spacing:.03em}
.empty .btn{margin-top:12px}

/* routine card */
.rt{display:flex;flex-direction:column;gap:10px}
.rt-top{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.rt-name{font-family:var(--head);font-size:22px;font-weight:700;line-height:1.1}
.rt-ex{font-size:14px;color:var(--tx2);line-height:1.35}
.rt-foot{display:flex;align-items:center;justify-content:space-between;gap:8px}
.rt-meta{font-size:13px;color:var(--tx3)}
.upnext{display:flex;flex-direction:column;gap:6px;border-color:var(--acc-mid);background:linear-gradient(160deg,var(--acc-dim),var(--s1) 70%)}
.upnext .btn{margin-top:8px}
.un-top{display:flex;align-items:center;justify-content:space-between}
.un-k{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--acc)}

/* resume */
.resume{background:linear-gradient(135deg,var(--acc-mid),var(--acc-dim));border:1px solid var(--acc-mid);border-radius:var(--r);padding:16px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.resume b{font-family:var(--head);font-size:22px;display:block;line-height:1.1}
.live{display:inline-flex;align-items:center;gap:6px;color:var(--acc);font-weight:700;font-size:13px;text-transform:uppercase;letter-spacing:.08em}
.live::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--acc-bg);animation:pulse 1.4s infinite}
@keyframes pulse{50%{opacity:.3}}

/* tabbar & mini */
.tabbar{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:min(520px,100%);display:grid;grid-template-columns:repeat(5,1fr);background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom));z-index:10}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;color:var(--tx3);font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.tab.on{color:var(--acc)}
.tab svg.i{width:22px;height:22px}
.mini{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(66px + env(safe-area-inset-bottom));width:min(504px,calc(100% - 16px));background:var(--acc-bg);color:var(--acc-ink);border-radius:12px;padding:10px 14px;display:flex;align-items:center;justify-content:space-between;font-weight:700;z-index:11;box-shadow:0 8px 24px rgba(0,0,0,.5)}
.mini span{font-family:var(--head);font-size:17px;letter-spacing:.02em}

/* layers */
.layer{position:fixed;inset:0;background:var(--page-bg,var(--bg));overflow-y:auto;-webkit-overflow-scrolling:touch;display:none}
.layer.open{display:block}
#workout{z-index:20} #screen{z-index:30}
.lhead{position:sticky;top:0;z-index:2;background:color-mix(in srgb,var(--bg) 94%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line)}
.lhead .ttl{font-family:var(--head);font-size:20px;font-weight:700;text-transform:uppercase;letter-spacing:.04em}
.wk-timer{font-family:var(--head);font-size:22px;font-weight:700;font-variant-numeric:tabular-nums;display:flex;align-items:center;gap:6px}
.wk-timer svg.i{color:var(--acc);width:18px;height:18px}
.wk-name{width:100%;background:transparent;border:0;font-family:var(--head);font-size:30px;font-weight:800;text-transform:uppercase;padding:4px 0;outline:none}
.wk-name:focus{border-bottom:2px solid var(--acc)}
.wk-date{color:var(--tx3);font-size:14px;margin-bottom:12px}

/* exercise card */
.ex{background:var(--s1);border:1px solid var(--line);border-radius:var(--r);padding:12px 10px 10px;margin-bottom:12px}
.ex-head{display:flex;align-items:flex-start;justify-content:space-between;gap:6px;padding:0 4px 8px}
.ex-name{font-family:var(--head);font-size:21px;font-weight:700;line-height:1.1;color:var(--acc)}
.ex-mus{font-size:12px;color:var(--tx3);font-weight:600;text-transform:uppercase;letter-spacing:.06em;margin-top:2px}
.ex-note{font-size:14px;color:var(--tx2);background:var(--s2);border-radius:8px;padding:6px 10px;margin:0 4px 8px}
.set-row{position:relative;display:grid;grid-template-columns:38px 1fr 70px 58px 44px;align-items:center;gap:6px;padding:4px;border-radius:10px}
.set-row.hdr{font-size:11px;font-weight:700;color:var(--tx3);text-transform:uppercase;letter-spacing:.08em;padding-top:0;padding-bottom:2px}
.set-row.hdr span{text-align:center} .set-row.hdr span:nth-child(2){text-align:left;padding-left:2px}
.set-row.done{background:var(--acc-dim)}
.set-num{height:34px;border-radius:8px;background:var(--s2);font-weight:700;font-size:15px}
.set-num.t-w{color:var(--warm)} .set-num.t-d{color:var(--drop)}
.prev{text-align:left;font-size:14px;color:var(--tx3);padding:0 2px;height:34px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.set-row input{width:100%;height:36px;border-radius:8px;border:1px solid transparent;background:var(--s2);text-align:center;font-weight:700;font-size:16px;outline:none;padding:0 4px}
.set-row input:focus{border-color:var(--acc)}
.set-row input::placeholder{color:var(--tx3);font-weight:500}
.set-row.done input{background:transparent}
.chk{height:36px;border-radius:8px;background:var(--s2);display:flex;align-items:center;justify-content:center;color:var(--tx3)}
.set-row.done .chk{background:var(--acc-bg);color:var(--acc-ink)}
.chk svg.i{stroke-width:3}
.pr-badge{position:absolute;right:52px;top:-6px;background:var(--acc-bg);color:var(--acc-ink);font-size:10px;font-weight:800;padding:1px 6px;border-radius:6px;letter-spacing:.06em;display:flex;align-items:center;gap:3px}
.pr-badge svg.i{width:11px;height:11px;stroke-width:2.5}
.ex-foot{display:grid;grid-template-columns:1fr auto;gap:8px;margin-top:8px}
.ex-foot button{height:38px;border-radius:10px;background:var(--s2);font-weight:700;font-size:14px;color:var(--tx2)}
.ex-foot button:first-child{color:var(--tx)}
.ex-foot button:last-child{padding:0 14px}

/* rest bar */
.rest{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom));width:min(504px,calc(100% - 16px));background:var(--s3);border:1px solid var(--line);border-radius:14px;overflow:hidden;z-index:25;box-shadow:0 10px 30px rgba(0,0,0,.6);display:none}
.rest.open{display:block}
.rest-fill{position:absolute;inset:0 auto 0 0;background:var(--acc-mid);transition:width .25s linear}
.rest-in{position:relative;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 10px}
.rest-time{font-family:var(--head);font-size:26px;font-weight:800;font-variant-numeric:tabular-nums;min-width:70px}
.rest-lbl{font-size:12px;color:var(--tx2);font-weight:700;text-transform:uppercase;letter-spacing:.08em}
.rest-btns{display:flex;gap:6px}
.rest-btns button{height:36px;padding:0 12px;border-radius:9px;background:color-mix(in srgb,currentColor 14%,transparent);font-weight:700;font-size:14px}
.rest.done{background:var(--acc-bg);color:var(--acc-ink)}
.rest.done .rest-lbl{color:var(--acc-ink)}
.rest.done .rest-fill{display:none}

/* sheet picker */
.sheet{position:fixed;inset:0;z-index:40;display:none}
.sheet.open{display:block}
.sheet-bg{position:absolute;inset:0;background:rgba(0,0,0,.6)}
.sheet-card{position:absolute;left:50%;transform:translateX(-50%);bottom:0;width:min(520px,100%);height:90vh;height:90dvh;background:var(--s1);border-radius:18px 18px 0 0;display:flex;flex-direction:column;border:1px solid var(--line);border-bottom:0}
.sheet-head{display:flex;align-items:center;justify-content:space-between;padding:12px 12px 8px}
.sheet-head .ttl{font-family:var(--head);font-size:20px;font-weight:700;text-transform:uppercase;letter-spacing:.04em}
.search{margin:0 12px 10px;position:relative}
.search input{width:100%;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--s2);padding:0 14px 0 40px;outline:none;font-size:16px}
.search input:focus{border-color:var(--acc)}
.search svg.i{position:absolute;left:12px;top:12px;color:var(--tx3)}
.chips{display:flex;gap:6px;overflow-x:auto;padding:0 12px 10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:32px;padding:0 12px;border-radius:999px;background:var(--s2);font-size:13px;font-weight:700;color:var(--tx2)}
.chip.on{background:var(--acc-bg);color:var(--acc-ink)}
.pk-list{flex:1;overflow-y:auto;padding:0 8px 12px;border-top:1px solid var(--line)}
.pk-group{font-size:11px;font-weight:800;color:var(--tx3);text-transform:uppercase;letter-spacing:.1em;padding:14px 8px 6px}
.pk-item{display:flex;width:100%;align-items:center;justify-content:space-between;gap:10px;padding:10px 8px;border-radius:10px;text-align:left}
.pk-item:active{background:var(--s2)}
.pk-item b{display:block;font-weight:600;font-size:16px}
.pk-item small{color:var(--tx3);font-size:13px}
.pk-item .tick{width:26px;height:26px;border-radius:8px;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;flex:none;color:transparent}
.pk-item.on .tick{background:var(--acc-bg);border-color:transparent;color:var(--acc-ink)}
.pk-item.on b{color:var(--acc)}
.sheet-foot{padding:10px 12px calc(10px + env(safe-area-inset-bottom));border-top:1px solid var(--line);display:flex;gap:8px}

/* modal */
.modal{position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;padding:20px}
.modal.open{display:flex}
.mbg{position:absolute;inset:0;background:rgba(0,0,0,.65)}
.mcard{position:relative;width:min(400px,100%);background:var(--s1);border:1px solid var(--line);border-radius:18px;padding:18px;max-height:86vh;overflow-y:auto}
.mcard h3{font-size:24px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;margin-bottom:8px}
.mbody{color:var(--tx2);font-size:15px}
.mbody p{margin:0 0 10px}
.macts{display:flex;gap:8px;margin-top:16px;position:sticky;bottom:-18px;background:var(--s1);padding:12px 0 18px;margin-bottom:-18px;z-index:2;box-shadow:0 -12px 12px -8px var(--s1)}
.macts .btn{flex:1}
.macts.col{flex-direction:column}
.macts.col .btn{flex:none}
.field{display:block;margin:10px 0}
.field span{display:block;font-size:12px;font-weight:700;color:var(--tx3);text-transform:uppercase;letter-spacing:.08em;margin-bottom:6px}
.field input,.field select,.field textarea{width:100%;min-height:44px;border-radius:10px;border:1px solid var(--line);background:var(--s2);padding:10px 12px;outline:none;font-size:16px}
.field textarea{min-height:110px;resize:vertical;font-family:ui-monospace,Menlo,monospace;font-size:13px}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--acc)}

/* toast */
.toast{position:fixed;left:50%;bottom:calc(140px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(10px);background:var(--tx);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:700;font-size:14px;z-index:60;opacity:0;pointer-events:none;transition:all .2s;max-width:90%;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.has-undo{pointer-events:auto;display:flex;align-items:center;gap:14px;padding:8px 8px 8px 16px;z-index:70}
.toast.has-undo{width:max-content;max-width:calc(100vw - 24px)}
.toast.has-undo span{min-width:0;line-height:1.3}
.toast.has-undo button{flex:none}
.toast.has-undo button{background:var(--acc-bg);color:var(--acc-ink);font-weight:800;border-radius:9px;padding:8px 14px;font-size:14px}
.toast.show.has-undo{bottom:calc(84px + env(safe-area-inset-bottom))}

/* history */
.mhead{font-family:var(--head);font-size:15px;font-weight:700;color:var(--tx3);text-transform:uppercase;letter-spacing:.1em;margin:20px 0 8px}
.hw{display:block;width:100%;text-align:left}
.hw-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.hw-name{font-family:var(--head);font-size:21px;font-weight:700}
.hw-date{font-size:13px;color:var(--tx3);white-space:nowrap}
.hw-meta{display:flex;gap:14px;font-size:13px;color:var(--tx2);margin:4px 0 8px;font-weight:600}
.hw-meta span{display:inline-flex;align-items:center;gap:4px}
.hw-meta svg.i{width:14px;height:14px}
.hw-ex{font-size:14px;color:var(--tx2);display:grid;grid-template-columns:1fr auto;gap:2px 10px}
.hw-ex .best{color:var(--tx3);text-align:right}
.trophy{color:var(--acc)}

/* detail */
.dt-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0}
.dt-stats .stat b{font-size:26px;white-space:nowrap}
.dt-ex{margin-bottom:12px}
.dt-ex h4{font-family:var(--head);font-size:20px;margin:0 0 6px;color:var(--acc)}
.dt-set{display:grid;grid-template-columns:30px 1fr auto;gap:8px;padding:6px 0;border-top:1px solid var(--line);font-size:15px}
.dt-set .n{color:var(--tx3);font-weight:700}
.dt-set .e{color:var(--tx3);font-size:13px;display:flex;align-items:center;gap:6px}

/* summary */
.sum-hero{text-align:center;padding:30px 0 10px}
.sum-hero .big{font-family:var(--head);font-size:44px;font-weight:800;text-transform:uppercase;line-height:1}
.sum-badge{width:72px;height:72px;margin:0 auto 14px;border-radius:20px;background:var(--acc-bg);color:var(--acc-ink);display:flex;align-items:center;justify-content:center}
.sum-badge svg.i{width:38px;height:38px;stroke-width:2.2}
.pr-list{display:flex;flex-direction:column;gap:8px}
.pr-item{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--acc-dim);border:1px solid var(--acc-mid);border-radius:12px;padding:10px 12px}
.pr-item b{font-weight:700}

/* routine editor */
.re-ex{display:flex;align-items:center;gap:8px;padding:10px;background:var(--s1);border:1px solid var(--line);border-radius:12px}
.re-ex .nm{flex:1;min-width:0}
.re-ex .nm b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.re-ex .nm small{color:var(--tx3);font-size:12px}
.step{display:flex;align-items:center;background:var(--s2);border-radius:10px}
.step button{width:32px;height:34px;font-weight:800;font-size:18px;color:var(--tx2)}
.step span{min-width:44px;text-align:center;font-weight:700;font-size:14px}
.re-ex .icon-btn{width:32px;height:34px}

/* reorder sheet */
.ro-card{height:auto;max-height:90vh;max-height:90dvh}
.ro-hint{color:var(--tx3);font-size:13px;padding:0 16px 10px}
.ro-list{overflow-y:auto;padding:10px 12px calc(14px + env(safe-area-inset-bottom));border-top:1px solid var(--line);display:flex;flex-direction:column;gap:8px;position:relative}
.ro-row{display:flex;align-items:center;gap:12px;min-height:58px;padding:8px 6px 8px 12px;background:var(--s2);border:1px solid var(--line);border-radius:12px;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;cursor:grab;transition:transform .18s ease;position:relative}
.ro-row .ro-n{width:22px;flex:none;text-align:center;font-weight:800;color:var(--tx3);font-size:14px}
.ro-row .nm{flex:1;min-width:0}
.ro-row .nm b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ro-row .nm small{color:var(--tx3);font-size:12px}

.dupe{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:14px}
.eq-chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.eqc{position:relative;padding:6px 11px;border-radius:999px;border:1px solid var(--line);background:var(--s2);font-size:13px;font-weight:700;color:var(--tx2);white-space:nowrap}
.eqc.used{color:var(--tx)}
.eqc.hit{border-color:var(--acc-mid);color:var(--tx)}
.eqc.on{background:var(--acc-bg);border-color:transparent;color:var(--acc-ink)}
.eqc:disabled{opacity:1}
.eq-last{position:absolute;top:3px;right:3px;width:6px;height:6px;border-radius:50%;background:var(--acc)}
.eqc.on .eq-last{background:var(--acc-ink)}
.ex-eq{margin-top:6px} .ex-eq .eqc{padding:4px 10px;font-size:12px}
.pos-tog{display:inline-flex;margin-top:6px;background:var(--s2);border:1px solid var(--line);border-radius:999px;padding:2px}
.pos-tog button{padding:4px 12px;border-radius:999px;font-size:12px;font-weight:700;color:var(--tx2)}
.pos-tog button.on{background:var(--tx);color:var(--bg)}
.pk-move{cursor:pointer} .pk-move.on b{color:var(--acc)}
.exr-move{cursor:default}
.aka{display:block;font-style:normal;font-size:12px;font-weight:600;color:var(--acc);margin-top:1px}
.aka-list{font-size:14px;color:var(--tx2);line-height:1.4}
.exr-l{min-width:0;flex:1} .exr-l b{display:block;font-weight:600}
.exr-r{display:flex;flex-direction:column;align-items:flex-end;gap:3px;flex:none}
.exr-r small{color:var(--tx3);font-size:11px;font-weight:600;white-space:nowrap}
.exr-r .tag{margin:0}
.ex-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:12px}
.ex-stats div{background:var(--s2);border-radius:10px;padding:8px 6px;text-align:center}
.ex-stats b{display:block;font-family:var(--head);font-size:18px;color:var(--tx);white-space:nowrap} .ex-stats span{font-size:10px;font-weight:700;color:var(--tx3);text-transform:uppercase;letter-spacing:.04em}
.tab span{font-size:10.5px}
@keyframes nudge{20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
.mcard.nudge{animation:nudge .35s}
.th-mode{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-bottom:12px;margin-bottom:4px;border-bottom:1px solid var(--line)}
.th-mode b{display:block} .th-mode small{color:var(--tx3);font-size:13px}
.switch{position:relative;width:52px;height:32px;border-radius:999px;background:var(--s3);flex:none;transition:background .2s}
.switch span{position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.35);transition:transform .2s}
.switch.on{background:var(--acc-bg)} .switch.on span{transform:translateX(20px)}
.switch:disabled{opacity:.4}
.foot-note{text-align:center;color:var(--tx3);font-size:13px;margin-top:28px}
/* Chalkbook Pro */
.pro-tag{display:inline-block;font-size:10.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--acc-ink);background:var(--acc-bg);border-radius:6px;padding:2px 6px;margin-left:6px;vertical-align:2px}
.pro-card{display:flex;align-items:center;gap:12px;margin:0 0 14px}
.pro-card > svg.i{color:var(--acc);width:26px;height:26px;flex:none}
.pro-card b{display:block} .pro-card small{color:var(--tx2);font-size:13px}
.pro-list{list-style:none;padding:0;margin:4px 0 12px;display:grid;gap:8px}
.pro-list li{display:grid;grid-template-columns:22px 1fr;gap:8px;color:var(--tx2)} .pro-list li b{color:var(--tx)}
.pro-list li svg.i{color:var(--acc);width:20px;height:20px;margin-top:1px}
.pro-lock{text-align:center;padding:26px 18px} .pro-lock > svg.i{width:34px;height:34px;color:var(--acc)} .pro-lock b{display:block;font-size:18px;margin:8px 0 6px;color:var(--tx)} .pro-lock p{color:var(--tx2);margin:0 0 12px}
.pro-price{font-family:var(--head);font-size:30px;font-weight:800;color:var(--tx);line-height:1}
.pro-price small{font-family:var(--body);font-size:14px;font-weight:600;color:var(--tx2);margin-left:6px}
.foot-note a{color:var(--tx2)}

/* loading */
.loading{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:var(--bg);z-index:100}
.spin{width:36px;height:36px;border-radius:50%;border:3px solid var(--s3);border-top-color:var(--acc);animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

// the routine you'd normally do next, learned from the order you actually run them (ties and new users: your routine list order)

  const done = S.workouts.filter(w => ids.has(w.routineId)).slice(0, 120).reverse().map(w => w.routineId);   // oldest → newest
  const order = S.routines.map(r => r.id), last = done[done.length - 1];
  if (!last) return order[0];
  const li = order.indexOf(last), after = k => (order.indexOf(k) - li + order.length) % order.length;
  const cnt = {};
  for (let i = 0; i < done.length - 1; i++) if (done[i] === last && done[i + 1] !== last) cnt[done[i + 1]] = (cnt[done[i + 1]] || 0) + 1;
  const best = Object.entries(cnt).sort((a, b) => b[1] - a[1] || after(a[0]) - after(b[0]))[0];
  return best ? best[0] : order[(li + 1) % order.length];
}

    <div class="stat"><b>${o.n}</b><span>Sessions</span><em>Since ${fmtShort(hist[0].ts)}</em></div>
  </div>`;
  html += `<div class="sec-head"><h2>Recent sessions</h2></div><div class="list">${o.all.slice(-8).reverse().map((h, i, arr) => {
    const prev = arr[i+1] && arr[i+1].old === h.old ? arr[i+1] : null, v = W ? h.e1 : h.bestReps, pv = prev ? (W ? prev.e1 : prev.bestReps) : null;
    const d = pv != null ? (W ? toU(v) - toU(pv) : v - pv) : null;
    const delta = d == null ? '' : Math.abs(d) < 0.05 ? `<span class="dl same">=</span>` : `<span class="dl ${d > 0 ? 'pos' : 'neg'}">${d > 0 ? '▲' : '▼'} ${fmtNum(Math.abs(d))}</span>`;
    return `<button class="card rs" data-a="open-workout" data-id="${h.id}">
      <div class="rs-top"><b>${fmtDate(h.ts)}${h.old ? ' <span class="tag">Old equipment</span>' : h.f !== 1 ? ' <span class="tag">Converted</span>' : ''}</b><span>${W ? fmtW(h.e1) + ' ' + unit() + ' est.' : h.bestReps + ' reps'} ${delta}</span></div>
      <div class="rs-sets">${h.sets.map(x => fmtSet(x)).join(' · ')}${h.f !== 1 ? ` <span class="faint">(logged ${h.sets.map(x => fmtSet({...x, w:x.raw})).join(' · ')})</span>` : ''}</div></button>`;
  }).join('')}</div>`;

}

/* charts: single series, accent marks, recessive grid, hover/tap tooltip */
const CHARTS = {};
function niceTicks(lo, hi, n) {
  const span = hi - lo || 1, raw = span / (n - 1), mag = Math.pow(10, Math.floor(Math.log10(raw)));
  const step = [1,2,2.5,5,10].map(m => m * mag).find(s => s >= raw) || 10 * mag;
  const out = []; for (let v = Math.floor(lo / step) * step; v < hi + step * 0.999; v += step) out.push(Math.round(v * 1000) / 1000);
  return out;
}
function lineChart(id, pts, breaks = []) {
  const W = 340, H = 190, pl = 38, pr = 14, pt = 16, pb = 26;
  let x0 = Math.min(...pts.map(p => p.x)), x1 = Math.max(...pts.map(p => p.x));
  if (x1 - x0 < DAY) { x0 -= 3 * DAY; x1 += 3 * DAY; }
  let y0 = Math.min(...pts.map(p => p.y)), y1 = Math.max(...pts.map(p => p.y));
  const pad = (y1 - y0) * 0.2 || Math.max(2, y1 * 0.08);
  const ticks = niceTicks(Math.max(0, y0 - pad), y1 + pad, 4);
  y0 = ticks[0]; y1 = ticks[ticks.length - 1];
  const X = x => pl + (x - x0) / (x1 - x0) * (W - pl - pr), Y = y => pt + (1 - (y - y0) / (y1 - y0)) * (H - pt - pb);
  const P = pts.map(p => ({...p, X:X(p.x), Y:Y(p.y)}));
  CHARTS[id] = {type:'line', P, W, H, pt, pb};
  const grid = ticks.map(t => `<line x1="${pl}" x2="${W-pr}" y1="${Y(t)}" y2="${Y(t)}" stroke="var(--line)" stroke-width="1"/><text x="${pl-8}" y="${Y(t)+4}" text-anchor="end" fill="var(--tx3)" font-size="11" font-weight="600">${fmtNum(t)}</text>`).join('');
  // one line per equipment segment, so a switch never draws a fake jump
  const cuts = breaks.map(b => b.x).filter(x => x > x0 && x <= x1).sort((a,b) => a - b);
  const segs = []; let cur = [];
  P.forEach((p,i) => { if (i && cuts.some(c => P[i-1].x < c && p.x >= c)) { segs.push(cur); cur = []; } cur.push(p); });
  if (cur.length) segs.push(cur);
  const paths = segs.map(sg => `<path d="${sg.map((p,i) => `${i ? 'L' : 'M'}${p.X.toFixed(1)},${p.Y.toFixed(1)}`).join('')}" fill="none" stroke="var(--acc)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" opacity="${sg[0].faded ? .3 : 1}"/>`).join('');
  const brk = breaks.filter(b => b.x > x0 && b.x <= x1).map(b => `<line x1="${X(b.x)}" x2="${X(b.x)}" y1="${pt-4}" y2="${H-pb}" stroke="var(--tx2)" stroke-width="1.5" stroke-dasharray="4 3"/><text x="${X(b.x)+4}" y="${pt+6}" fill="var(--tx2)" font-size="10" font-weight="700">${esc(b.label)}</text>`).join('');
  const xl = `<text x="${P[0].X}" y="${H-6}" text-anchor="${P.length>1?'start':'middle'}" fill="var(--tx3)" font-size="11" font-weight="600">${fmtShort(P[0].x)}</text>` + (P.length > 1 ? `<text x="${P[P.length-1].X}" y="${H-6}" text-anchor="end" fill="var(--tx3)" font-size="11" font-weight="600">${fmtShort(P[P.length-1].x)}</text>` : '');
  const dots = P.map((p,i) => `<circle class="dot${p.faded ? ' faded' : ''}" data-i="${i}" cx="${p.X}" cy="${p.Y}" r="4" fill="var(--acc)" stroke="var(--s1)" stroke-width="2" opacity="${p.faded ? .3 : 1}"/>`).join('');
  return `<div class="chart" data-chart="${id}"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Line chart, ${P.length} sessions">
    ${grid}${xl}<line class="xh" x1="0" x2="0" y1="${pt}" y2="${H-pb}" stroke="var(--tx3)" stroke-width="1" stroke-dasharray="3 3" opacity="0"/>
    ${brk}${paths}${dots}
    <rect class="hit" x="0" y="0" width="${W}" height="${H}" fill="transparent"/></svg><div class="tip"></div></div>`;
}
function initCharts(root) {
  root.querySelectorAll('.chart').forEach(el => {
    const c = CHARTS[el.dataset.chart]; if (!c) return;
    const svg = el.querySelector('svg'), tip = el.querySelector('.tip'), xh = el.querySelector('.xh');
    const show = ev => {
      const r = svg.getBoundingClientRect(); const sx = (ev.clientX - r.left) / r.width * c.W;
      let bi = 0, bd = Infinity; c.P.forEach((p,i) => { const d = Math.abs(p.X - sx); if (d < bd) { bd = d; bi = i; } });
      const p = c.P[bi]; const k = r.width / c.W;
      tip.innerHTML = p.tip; tip.classList.add('show');
      const left = Math.min(Math.max(p.X * k, 70), r.width - 70);
      tip.style.left = left + 'px'; tip.style.top = (Math.min(p.Y, c.H - 30) * k - 10) + 'px';
      svg.querySelectorAll('.dot').forEach(d => d.setAttribute('opacity', +d.dataset.i === bi ? '1' : d.classList.contains('faded') ? '.15' : '.45'));
      if (xh) { xh.setAttribute('x1', p.X); xh.setAttribute('x2', p.X); xh.setAttribute('opacity', '1'); }
    };
    const hide = () => { tip.classList.remove('show'); svg.querySelectorAll('.dot').forEach(d => d.setAttribute('opacity', d.classList.contains('faded') ? '.3' : '1')); if (xh) xh.setAttribute('opacity','0'); };
    svg.addEventListener('pointermove', show); svg.addEventListener('pointerdown', show); svg.addEventListener('pointerleave', hide);
  });
}

// warm-up sets: a ramp up to the first working set
function warmupPlan(workKg, eq) {
  const u = unit(), step = u === 'lb' ? 5 : 2.5, bar = eq === 'Barbell' || eq === 'Smith machine' ? (u === 'lb' ? 45 : 20) : eq === 'EZ bar' ? (u === 'lb' ? 25 : 10) : 0;
  const work = toU(workKg), out = [];
  const ramp = bar ? [[0, 10], [.4, 5], [.6, 3], [.8, 2]] : [[.5, 8], [.7, 5], [.85, 3]];
  for (const [f, r] of ramp) {
    let w = f === 0 ? bar : Math.round(work * f / step) * step;
    if (bar && w < bar) w = bar;
    if (w >= work - step / 2 || w <= 0) continue;
    if (out.length && w <= out[out.length - 1].w) continue;
    out.push({w, r});
  }
  return out.map(x => ({w:toKg(x.w), r:x.r, t:'w', done:false}));
}
function addWarmups(i) {
  const e = S.active && S.active.ex[i]; if (!e) return;
  const firstWork = e.sets.findIndex(s => s.t !== 'w');
  const ws = firstWork >= 0 ? e.sets[firstWork] : null, p = ws ? prevFor(e, firstWork) : null;
  const work = ws && ws.w > 0 ? ws.w : p && p.w > 0 ? p.w : 0;
  if (!work) { toast('Enter the weight for your first working set, then add warm-ups'); return; }
  if (usesBW(e.exId)) { toast('Warm-ups are for weighted exercises'); return; }
  const plan = warmupPlan(work, exInfo(e.exId).eq);
  if (!plan.length) { toast('That’s light enough to skip warm-ups'); return; }
  const before = clone(e.sets);
  // keep warm-ups already done or filled in; replace empty ones
  const keep = e.sets.filter(s => s.t === 'w' && (s.done || s.w != null || s.r != null));
  e.sets = [...keep, ...plan, ...e.sets.filter(s => s.t !== 'w')];
  markDirty('active'); rerenderCard(i);
  toastUndo(`${plural(plan.length, 'warm-up set')} added, up to ${fmtW(plan[plan.length - 1].w)} ${unit()}`, () => { if (S.active && S.active.ex[i] === e) { e.sets = before; markDirty('active'); rerenderCard(i); } });
}

// spreadsheet export: one row per set

  const rows = [['Date', 'Time', 'Workout', 'Exercise', 'Equipment', 'Set', 'Type', `Weight (${u})`, 'Reps', `Est. 1RM (${u})`, 'Duration (min)', 'Note']];

  if (p.spotter) { imp = null; screen = null; renderAll(); importBackup(text); return; }
  if (p.error) { toast(p.error); return; }
  Object.assign(imp, p, {step:'map', match:{}, unitAsked:!p.unit});
  if (!imp.unit) imp.unit = S.settings.units;
  impBuild(); renderScreen();
}
function screenImport() {

    <h1 class="h1" style="margin:6px 0 8px">Bring your history</h1>

  const n = B.list.length - B.dupes.size;

  return head + `<div class="wrap" style="padding-bottom:140px">

    <div class="sec-head"><h2>Columns</h2><span class="faint" style="font-size:13px">${ok ? 'Matched automatically' : 'Needs a fix'}</span></div>
    <details class="card imp-map" ${ok && !imp.mapOpen ? '' : 'open'}><summary>${ok ? 'Check or change which column is which' : 'Pick the columns marked *'}</summary>

    <div class="sec-head"><h2>Weight unit</h2></div>
    <div class="seg">${[['lb','Pounds (lb)'],['kg','Kilograms (kg)']].map(([k,l]) => `<button class="${imp.unit===k?'on':''}" data-a="imp-unit" data-k="${k}">${l}</button>`).join('')}</div>

    <p class="imp-note" style="margin-top:-4px">Tap any to change it. “New custom” ones get added to your exercise list.</p>
    <div class="list imp-exs">${names.map(exRow).join('')}</div>

    <label class="imp-opt"><input type="checkbox" data-impopt="skipDupes" ${imp.opts.skipDupes ? 'checked' : ''}><span><b>Skip workouts already in Chalkbook</b><small>Same day and time, or same day and name. ${B.dupes.size ? plural(B.dupes.size,'match') + ' found.' : 'None found.'}</small></span></label>

/* ---------- modal & toast ---------- */
let modalActs = [];
function modal({title, body = '', actions = [{label:'OK'}], col = false, focus}) {
  modalActs = actions;
  const m = $('#modal');
  m.innerHTML = `<div class="mbg" data-a="modal-bg"></div><div class="mcard" role="dialog" aria-modal="true">${title ? `<h3>${esc(title)}</h3>` : ''}<div class="mbody">${body}</div>
    <div class="macts ${col ? 'col' : ''}">${actions.map((a,i) => `<button class="btn ${a.cls || 'btn-ghost'} ${col ? 'block' : ''}" data-a="modal-act" data-k="${i}">${esc(a.label)}</button>`).join('')}</div></div>`;
  m.dataset.dirty = '';
  m.classList.add('open');
  if (focus) setTimeout(() => { const f = m.querySelector(`[name="${focus}"]`); f && f.focus(); }, 30);
}
function modalDirty() { const m = $('#modal'); return m.classList.contains('open') && m.dataset.dirty === '1'; }
function tryCloseModal() {
  if (!modalDirty()) return closeModal();
  const c = document.querySelector('#modal .mcard'); c.classList.remove('nudge'); void c.offsetWidth; c.classList.add('nudge');
  toast('Tap Save to keep your changes, or Cancel');
}
function closeModal() { const m = $('#modal'); m.dataset.dirty = ''; m.classList.remove('open'); m.innerHTML = ''; }
function modalVals() { const v = {}; $('#modal').querySelectorAll('[name]').forEach(el => v[el.name] = el.value); return v; }
let toastT, undoFn = null;
function toast(msg) { const t = $('#toast'); undoFn = null; t.classList.remove('has-undo'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 2400); }
// a few seconds to take back anything destructive
function toastUndo(msg, fn, ms = 8000) {
  const t = $('#toast'); undoFn = fn;
  t.innerHTML = `<span>${esc(msg)}</span><button data-a="undo">Undo</button>`;
  t.classList.add('show', 'has-undo'); clearTimeout(toastT);
  toastT = setTimeout(() => { t.classList.remove('show', 'has-undo'); undoFn = null; }, ms);
}
function feedbackModal() {

      <p>What’s working, what’s annoying, what’s missing? Every message gets read.</p>

/* ---------- backup ---------- */
function backupJSON() { return JSON.stringify({app:'spotter', version:1, exported:new Date().toISOString(), ...clone(S)}, null, 0); }
async function copyBackup() {
  const txt = backupJSON();
  try { await navigator.clipboard.writeText(txt); toast('Backup copied — paste it into Notes or a message to yourself'); }
  catch { modal({title:'Copy your backup', body:`<p>Select all and copy this text, then keep it somewhere safe.</p><label class="field"><textarea readonly onclick="this.select()">${esc(txt)}</textarea></label>`, actions:[{label:'Done'}]}); }
}
function importBackup(text) {
  let d; try { d = JSON.parse(text); } catch { toast('That doesn’t look like a Chalkbook backup'); return; }
  const n = normalize(d);
  if (!hasData(n)) { toast('That backup is empty'); return; }
  modal({title:'Replace your data?', body:`<p>This replaces everything here with the backup: ${plural(n.workouts.length,'workout')} and ${plural(n.routines.length,'routine')}.</p>`,
    actions:[{label:'Cancel'}, {label:'Replace', cls:'btn-danger', fn:() => { const keys = allKeys(); S = n; workoutOpen = false; rest = null; markDirty(...new Set([...keys, ...allKeys()])); flush(); renderAll(); toast('Backup restored'); }}]});
}
$('#impFile').addEventListener('change', e => {
  const f = e.target.files && e.target.files[0]; if (!f || !imp) return;
  if (f.size > 15e6) { toast('That file is too big (15 MB max)'); e.target.value = ''; return; }
  const rd = new FileReader(); rd.onload = () => impLoadText(String(rd.result), f.name); rd.readAsText(f); e.target.value = '';
});
$('#fileIn').addEventListener('change', e => {
  const f = e.target.files && e.target.files[0]; if (!f) return;
  const rd = new FileReader(); rd.onload = () => importBackup(String(rd.result)); rd.readAsText(f); e.target.value = '';
});

  'prog-metric': el => { progMetric = el.dataset.k; const y = window.scrollY; renderView(); window.scrollTo(0, y); },
  'cal-nav': el => {
    const d = new Date(calMonth); d.setMonth(d.getMonth() + +el.dataset.v);
    const now = new Date(); if (d > new Date(now.getFullYear(), now.getMonth() + 1, 1)) return;
    calMonth = d.getTime();
    const inM = S.workouts.filter(w => { const x = new Date(w.start); return x.getFullYear() === d.getFullYear() && x.getMonth() === d.getMonth(); });
    const isCur = d.getFullYear() === now.getFullYear() && d.getMonth() === now.getMonth();
    calSel = inM.length ? dayKey(inM[0].start) : isCur ? dayKey(Date.now()) : dayKey(new Date(d.getFullYear(), d.getMonth() + 1, 0).getTime());
    renderView();
  },
  'cal-day': el => { calSel = el.dataset.k; renderView(); },
  'off-new': () => offModal(),
  'off-range': el => offModal(+el.dataset.d),
  'off-day': el => {
    const d = +el.dataset.d, t = el.dataset.t;
    removeOffRange(d, d); S.off.push({id:uid(), type:t, from:d, to:d, note:''}); S.off.sort((x,y) => x.from - y.from);
    markDirty('profile'); renderView(); toast(`${OFF[t].label} logged`);
  },
  'off-del': el => {
    const d = +el.dataset.d, o = offMap().get(d); if (!o) return;
    const go = all => { if (all) S.off = S.off.filter(x => x.id !== o.id); else removeOffRange(d, d); markDirty('profile'); renderView(); toast('Removed'); };
    if (o.to > o.from) menu(`${OFF[o.type].label} · ${fmtShort(idxTs(o.from))}–${fmtShort(idxTs(o.to))}`, [{label:'Remove just this day', fn:() => go(false)}, {label:'Remove all of it', cls:'btn-danger-ghost', fn:() => go(true)}]);
    else go(true);
  },
  'open-workout': el => { screen = {type:'detail', id:el.dataset.id}; renderAll(); },
  'screen-close': closeScreen,
  'detail-menu': el => {
    const w = S.workouts.find(x => x.id === el.dataset.id); if (!w) return;
    menu(w.name, [
      {label:'Save as routine', fn:() => saveAsRoutine(w)},
      {label:'Rename', fn:() => modal({title:'Rename', body:`<label class="field"><input name="name" value="${esc(w.name)}" maxlength="40"></label>`, focus:'name', actions:[{label:'Cancel'}, {label:'Save', cls:'btn-acc', validate:v => !!v.name.trim(), fn:v => { w.name = v.name.trim(); markDirty('log-' + monthKey(w.start)); renderAll(); }}]})},
      {label:'Delete workout', cls:'btn-danger-ghost', fn:() => modal({title:'Delete workout?', body:`<p>${esc(w.name)} from ${fmtDate(w.start)} will be removed from your history, charts and PRs.</p>`, actions:[{label:'Delete', cls:'btn-danger-ghost', fn:() => {
        S.workouts = S.workouts.filter(x => x.id !== w.id); markDirty('log-' + monthKey(w.start)); screen = null; renderAll();
        toastUndo('Workout deleted', () => { if (!S.workouts.some(x => x.id === w.id)) { S.workouts.push(w); S.workouts.sort((a,b) => b.start - a.start); markDirty('log-' + monthKey(w.start)); renderAll(); toast('Workout restored'); } });
      }}, {label:'Keep it', cls:'btn-acc'}]})},
    ]);
  },
  'repeat-workout': el => { const w = S.workouts.find(x => x.id === el.dataset.id); if (w) startWorkout({name:w.name, routineId:w.routineId, ex:w.ex.map(e => ({exId:e.exId, n:e.sets.length}))}); },
  'save-as-routine': el => { const w = S.workouts.find(x => x.id === el.dataset.id); if (w) saveAsRoutine(w); },
  'routine-update': el => {
    const w = S.workouts.find(x => x.id === el.dataset.id); const r = w && S.routines.find(x => x.id === w.routineId);
    if (!r) return; r.ex = w.ex.map(e => ({exId:e.exId, n:e.sets.length})); markDirty('profile'); el.remove(); toast(`“${r.name}” updated`);
  },

  'quote-next': el => {
    quoteIdx = (quoteIdx + 1) % QUOTES.length;
    try { localStorage.setItem('spotter.quote', String(quoteIdx)); } catch {}
    el.classList.add('fade');
    setTimeout(() => { el.innerHTML = quoteHTML(); el.classList.remove('fade'); }, 180);
  },
  awake: () => { S.settings.awake = S.settings.awake === false; if (S.settings.awake) delete S.settings.awake; markDirty('profile'); const y = window.scrollY; renderAll(); window.scrollTo(0, y); syncWake(); },
  appearance: () => { S.settings.appearance = S.settings.appearance === 'light' ? 'dark' : 'light'; markDirty('profile'); const y = window.scrollY; renderAll(); window.scrollTo(0, y); },
  theme: el => { S.settings.theme = el.dataset.k; markDirty('profile'); const y = window.scrollY; renderAll(); window.scrollTo(0, y); },
  'bw-edit': () => bwModal(false),
  'bw-open': () => { screen = {type:'bw'}; renderAll(); },
  'bw-log': () => weighInModal(),
  'bw-del': el => { const i = S.bwLog.findIndex(e => e.id === el.dataset.id); if (i < 0) return; const [e] = S.bwLog.splice(i, 1);
    syncBwSetting(); markDirty('profile'); renderScreenKeep(); renderView();
    toastUndo(`Deleted ${fmtW(e.kg)} ${unit()} from ${fmtShort(e.t)}`, () => { S.bwLog.push(e); S.bwLog.sort((a, b) => a.t - b.t); syncBwSetting(); markDirty('profile'); renderScreenKeep(); renderView(); }); },
  setting: el => {
    const k = el.dataset.k; let v = el.dataset.v; if (k === 'rest') v = +v;
    S.settings[k] = v; markDirty('profile'); renderAll();
  },
  'demo-reset': () => modal({title:'Reset demo data?', body:'<p>Brings back the original 5-month sample log, ending today. Anything you logged here is cleared.</p>', actions:[{label:'Cancel'}, {label:'Reset', cls:'btn-acc', fn:() => {
    S = freshDemo(); workoutOpen = false; rest = null; calMonth = null; calSel = null; progEx = null; saveLocal(); renderAll(); toast('Demo data reset');
  }}]}),
  'imp-open': openImport,
  'imp-cancel': () => { imp = null; closeScreen(); },
  'imp-pick': () => $('#impFile').click(),
  'imp-paste': () => { const t = $('#impPaste') && $('#impPaste').value; if (!t || !t.trim()) { toast('Paste something first'); return; } impLoadText(t, 'Pasted data'); },
  'imp-restart': () => { imp = {step:'file', match:{}, opts:imp.opts}; renderScreen(); },
  'imp-unit': el => { imp.unit = el.dataset.k; renderScreenKeep(); },
  'imp-ex': el => {
    const name = el.dataset.k, m = imp.match[name];
    menu(name, [
      {label:'Pick from exercise list…', fn:() => openPicker(ids => { imp.match[name] = {id:ids[0], how:'manual'}; renderScreenKeep(); }, {single:true, title:'Match exercise'})},
      {label:'Import as its own custom exercise', fn:() => { imp.match[name] = {id:null, how:'new'}; renderScreenKeep(); }},
      ...(m.how === 'skip' ? [] : [{label:'Skip this exercise', cls:'btn-danger-ghost', fn:() => { imp.match[name] = {...m, how:'skip'}; renderScreenKeep(); }}]),
    ]);
  },
  'imp-go': impDoImport,
  'imp-undo': el => { const b = S.imports.find(x => x.id === el.dataset.id); if (!b) return;
    modal({title:'Undo this import?', body:`<p>Removes the ${plural(b.workouts,'workout')} it added${b.routines.length ? `, the ${plural(b.routines.length,'routine')} it made` : ''}${b.customs.length ? ', and custom exercises it created that you haven’t used since' : ''}. Everything else stays.</p>`, actions:[{label:'Cancel'}, {label:'Undo import', cls:'btn-danger', fn:() => undoImport(b.id)}]}); },
  'feedback-open': () => feedbackModal(),
  'pro-open': () => proModal(),
  'export-csv': () => proGate(exportCsv),
  'host-delete': () => { const via = (HOST.account() || {}).via, pw = via === 'password';
    modal({title:'Delete your account?', body:`<p>This deletes your Chalkbook account and signs you out right away.</p>
      <p>Your workout log is kept for 30 days in case you change your mind. To get it back, sign in again and email ${esc(HOST.contact || 'us')} with the email address of your old account. After 30 days it’s deleted for good.</p>
      <p>Want your own copy? Tap Cancel, then <b>Copy backup</b> first.</p>
      ${pw ? '<label class="field"><span>Type your password to confirm</span><input type="password" name="pw" autocomplete="current-password"></label>' : ''}`,
    focus:pw ? 'pw' : undefined,
    actions:[{label:'Cancel'}, {label:'Delete account', cls:'btn-danger', validate:pw ? v => v.pw ? true : 'Type your password to confirm' : undefined, fn:v => { flush(); toast('Deleting your account…');
      setTimeout(() => Promise.resolve(HOST.deleteAccount(v && v.pw)).then(() => location.reload(), e => {
        const c = (e && e.code) || '', who = via === 'apple' ? 'Apple' : 'Google';
        toast(c === 'auth/popup-closed-by-user' || c === 'auth/cancelled-popup-request' || c === 'auth/user-cancelled' ? 'Account not deleted'
          : c === 'auth/popup-blocked' ? `Allow pop-ups to confirm with ${who}, then try again`
          : c === 'auth/missing-password' ? 'Type your password to delete your account'
          : c === 'auth/invalid-credential' || c === 'auth/wrong-password' || c === 'auth/invalid-login-credentials' ? 'Wrong password. Account not deleted'
          : c === 'auth/too-many-requests' ? 'Too many tries. Wait a few minutes and try again'
          : 'Couldn’t delete your account. Check your connection and try again');
      }), 400); }}]}); },
  'host-signin': () => HOST && HOST.signIn && HOST.signIn(),
  'host-signout': () => modal({title:'Sign out?', body:'<p>Your log stays saved in your account. Sign back in any time to get it.</p>', actions:[{label:'Cancel'}, {label:'Sign out', cls:'btn-danger', fn:() => { flush(); setTimeout(() => HOST.signOut(), 400); }}]}),
  'backup-copy': copyBackup,
  'backup-file': () => $('#fileIn').click(),
  'backup-paste': () => modal({title:'Paste backup', body:'<label class="field"><textarea name="txt" placeholder="Paste the backup text here"></textarea></label>', focus:'txt', actions:[{label:'Cancel'}, {label:'Import', cls:'btn-acc', fn:v => importBackup(v.txt)}]}),
  wipe: () => modal({title:'Delete everything?', body:'<p>All workouts, routines and custom exercises will be erased. Copy a backup first if you might want them back.</p>', actions:[{label:'Delete all', cls:'btn-danger-ghost', fn:() => {
    const keys = allKeys(), snap = clone(S); S = DEFAULT(); workoutOpen = false; rest = null; markDirty(...keys); flush(); renderAll();
    toastUndo('All data deleted', () => { S = normalize(snap); markDirty(...new Set([...keys, ...allKeys()])); flush(); renderAll(); toast('Everything’s back'); }, 12000);
  }}, {label:'Keep my data', cls:'btn-acc'}]}),

  'pk-close': closePicker,
  'ro-cancel': closeReorder,
  'ro-done': () => { const r = ro, order = roOrder(); closeReorder(); if (r && order.some((v, i) => v !== i)) r.onDone(order); },
  'pk-mus': el => { pk.mus = el.dataset.k; renderPicker(); },
  // tapping a movement's name: picks the equipment you used last (or the first one); tapping again clears it
  'pk-move': el => {
    const vars = MOVE[el.dataset.move].v.flatMap(([, id]) => posPair(id)), picked = vars.filter(id => pk.sel.includes(id));
    if (pk.single) { const cb = pk.cb; closePicker(); cb([el.dataset.id]); return; }
    if (picked.length) { pk.sel = pk.sel.filter(id => !vars.includes(id)); renderPkList(); updatePkAdd(); return; }
    A['pk-toggle'](el);
  },
  'pk-toggle': el => {
    const id = el.dataset.id;
    if (pk.single) { const cb = pk.cb; closePicker(); cb([id]); return; }
    const k = pk.sel.indexOf(id); if (k >= 0) pk.sel.splice(k, 1); else pk.sel.push(id);
    document.querySelectorAll(`#pkList [data-id="${CSS.escape(id)}"]`).forEach(x => x.classList.toggle('on', k < 0));
    document.querySelectorAll('#pkList .pk-move').forEach(r => r.classList.toggle('on', !!r.querySelector('.eqc.on')));
    updatePkAdd();
  },
  'pk-add': () => { if (!pk.sel.length) return; const ids = pk.sel.slice(), cb = pk.cb; closePicker(); cb(ids); },
  'pk-new': () => newCustomExercise(pk ? pk.q : ''),

  'modal-bg': tryCloseModal,
  'modal-act': el => {
    const a = modalActs[+el.dataset.k]; if (!a) return closeModal();
    const v = modalVals();
    if (a.validate) { const ok = a.validate(v); if (ok !== true && (!ok || typeof ok === 'string')) { toast(typeof ok === 'string' ? ok : 'Fill that in first'); return; } }
    closeModal(); a.fn && a.fn(v);
  },
};
function renderScreenKeep() { const L = $('#screen'), st = L.scrollTop; renderScreen(); L.scrollTop = st; }
function exMenuRemove(i) {
  const e = S.active.ex[i];
  const did = e.sets.some(s => s.done);
  const go = () => { const [gone] = S.active.ex.splice(i, 1); markDirty('active'); renderWorkout();
    const act = S.active; toastUndo(`${exName(gone.exId)} removed`, () => { if (S.active === act) { act.ex.splice(Math.min(i, act.ex.length), 0, gone); markDirty('active'); renderWorkout(); } }); };
  if (did) modal({title:'Remove exercise?', body:`<p>${esc(exName(e.exId))} has checked-off sets. Remove it anyway?</p>`, actions:[{label:'Cancel'}, {label:'Remove', cls:'btn-danger', fn:go}]});
  else go();
}
function confirmDeleteRoutine(r, fromEditor) {
  modal({title:'Delete routine?', body:`<p>“${esc(r.name)}” will be removed. Your past workouts stay in history.</p>`, actions:[{label:'Cancel'}, {label:'Delete', cls:'btn-danger', fn:() => {
    const at = S.routines.indexOf(r);
    S.routines = S.routines.filter(x => x.id !== r.id); markDirty('profile');
    if (fromEditor) { draft = null; screen = null; } renderAll();
    toastUndo('Routine deleted', () => { if (!S.routines.some(x => x.id === r.id)) { S.routines.splice(Math.max(0, at), 0, r); markDirty('profile'); renderAll(); } });
  }}]});
}
function saveAsRoutine(w) {
  modal({title:'Save as routine', body:`<label class="field"><span>Name</span><input name="name" value="${esc(w.name)}" maxlength="40"></label>`, focus:'name',
    actions:[{label:'Cancel'}, {label:'Save', cls:'btn-acc', validate:v => !!v.name.trim(), fn:v => {
      const r = {id:uid(), name:v.name.trim(), ex:w.ex.map(e => ({exId:e.exId, n:e.sets.length}))};
      S.routines.push(r);
      if (!w.routineId) { w.routineId = r.id; markDirty('log-' + monthKey(w.start)); }
      markDirty('profile'); renderAll(); toast('Routine saved');
    }}]});
}

document.addEventListener('click', e => {
  const el = e.target.closest('[data-a]');
  if (!el || el.disabled) return;
  const fn = A[el.dataset.a]; if (fn) fn(el, e);
});
document.addEventListener('input', e => {
  if (e.target.closest && e.target.closest('#modal')) $('#modal').dataset.dirty = '1';
  const t = e.target;
  if (t.matches('#workout input[data-f]') && S.active) {
    const s = S.active.ex[+t.dataset.ei].sets[+t.dataset.si];
    const raw = t.value.replace(',', '.').trim();
    if (t.dataset.f === 'w') { const v = parseFloat(raw); s.w = raw === '' || !isFinite(v) ? null : Math.max(0, toKg(v)); }
    else { const v = parseInt(raw, 10); s.r = raw === '' || !isFinite(v) ? null : Math.max(0, Math.min(999, v)); }
    markDirty('active');
  } else if (t.matches('[data-wkname]') && S.active) { S.active.name = t.value; markDirty('active'); }
  else if (t.matches('[data-draftname]') && draft) { draft.name = t.value; }
  else if (t.id === 'pkSearch' && pk) { pk.q = t.value; renderPkList(); }
  else if (t.id === 'exSearch') { exv.q = t.value; renderExList(); }
  else if (t.matches('[data-gs]') && gs) { const st = gs.rows[t.dataset.ex] = gs.rows[t.dataset.ex] || {}; st[t.dataset.gs] = t.value; st.est = false; }
  else if (t.matches('[data-gsname]') && gs) { gs.name = t.value; }
});
document.addEventListener('change', e => {
  if (e.target.closest && e.target.closest('#modal')) $('#modal').dataset.dirty = '1';
  const t = e.target;
  if (t.matches('[data-impmap]') && imp) { imp.mapOpen = true; const f = t.dataset.impmap, v = t.value; for (const k of Object.keys(imp.map)) if (v !== '' && imp.map[k] === +v) imp.map[k] = null; imp.map[f] = v === '' ? null : +v; renderScreenKeep(); return; }
  if (t.matches('[data-impopt]') && imp) { imp.opts[t.dataset.impopt] = t.checked; renderScreenKeep(); return; }
  if (t.matches('[data-gsdate]') && gs) { gs.date = t.value; for (const st of Object.values(gs.rows)) { delete st.oldw; delete st.neww; } renderScreenKeep(); }
  else if (t.matches('#modal [name=mode]')) syncConvVisibility();
  else if (t.matches('#modal [name=date]')) { const ex = document.querySelector('#modal h3') && progEx; const c = $('#eqConv'); if (c && ex && fromIso(t.value)) c.innerHTML = convFields(ex, fromIso(t.value)); }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { if ($('#modal').classList.contains('open')) tryCloseModal(); else if (ro) closeReorder(); else if (pk) closePicker(); }
  if (e.key === 'Enter' && e.target.matches('#workout input[data-f]')) e.target.blur();
});

boot();
})();
</script>
</body>
</html>
